<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tú eres UNACEM Ecuador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <div class="menu" id="menu" role="dialog" aria-label="Recorridos y roles">
    <div class="scrim" id="scrim"></div>
    <div class="sheet"><div class="sheet-in">
      <div class="mhead"><div><b>Tú eres UNACEM Ecuador</b><span>Prototipo de la app de inducción · datos de ejemplo</span></div><button class="x" id="mClose" aria-label="Cerrar menú">✕</button></div>
      <div><h3>Recorridos guiados</h3><ol class="list" id="tours"></ol></div>
      <div><h3>Explorar por tu cuenta</h3><div class="chips" id="roles"></div></div>
    </div></div>
  </div>
  <div class="main">
    <header class="bar">
      <div class="bar-row">
        <button class="menubtn" id="bMenu" aria-label="Abrir recorridos"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Recorridos</button>
        <div class="ttl" id="ttl"></div>
        <div class="cnt" id="cnt"></div>
      </div>
      <div class="segs" id="segs"></div>
    </header>
    <div class="stagearea" id="area">
      <div class="stagebox" id="stage"><div class="device ph" id="dev"></div></div>
      <div class="done" id="done" hidden></div>
    </div>
    <footer class="dock"><div class="dock-in">
      <div class="who"><span class="pill" id="pill"></span><span class="scrn" id="scrn"></span></div>
      <p class="cap" id="cap" aria-live="polite"></p>
      <div class="dockrow"><button class="btn" id="bPrev"></button><button class="btn pri" id="bNext"></button></div>
    </div></footer>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
