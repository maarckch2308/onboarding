<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; font-family: 'Barlow', system-ui, sans-serif; color: #2B2B2E; overflow: hidden">

  <!-- Encabezado con imagen de fondo -->
  <div class="app-hdr">
    <button aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="hdr-e">HITO DEL DÍA 30 · HAZ TUYO EL ROL</div>
    <h1 class="hdr-t">Confirmar desayuno</h1>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <div style="background: #fff; border: 1px solid #E5E5E8; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #ECECEF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">AP</div>
      <div style="flex: 1">
        <div style="font-size: 17px; font-weight: 700">Andrea Pérez</div>
        <div style="font-size: 13px; color: #5B5B63">Analista de Planta · Día 30 de 90</div>
      </div>
    </div>

    <div>
      <div style="font-size: 14px; font-weight: 600; color: #5B5B63; margin-bottom: 8px">¿Cuándo se realizó el encuentro?</div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 48px; border: 2px solid var(--brand); border-radius: 12px; background: #FDEDEF; color: var(--brand); font-size: 15px; font-weight: 700">Hoy</button>
        <button style="flex: 1; height: 48px; border: 1.5px solid #C8C8CE; border-radius: 12px; background: #fff; color: #2B2B2E; font-size: 15px; font-weight: 600">Ayer</button>
        <button style="flex: 1; height: 48px; border: 1.5px solid #C8C8CE; border-radius: 12px; background: #fff; color: #2B2B2E; font-size: 15px; font-weight: 600">Otra fecha</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="n" style="font-size: 14px; font-weight: 600; color: #5B5B63">Nota para Andrea (opcional)</label>
      <textarea id="n" rows="3" placeholder="Ej.: Gracias por tu energía este primer mes." style="padding: 12px 14px; border: 1.5px solid #C8C8CE; border-radius: 12px; font-size: 15px; box-sizing: border-box; width: 100%; resize: none"></textarea>
    </div>

    <div style="background: #EAF2FD; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <div style="font-size: 14px; color: #1E3A8A; line-height: 1.4">Andrea recibirá una notificación para confirmar el encuentro y calificarlo. Los trofeos se entregan cuando ambos confirman.</div>
    </div>

    <div style="flex: 1"></div>

    <button style="height: 54px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 18px; font-weight: 700">Confirmar desayuno</button>

  </div>

  <div role="navigation" aria-label="Navegación" style="flex: none; display: flex; background: #fff; border-top: 1px solid #E5E5E8; padding: 4px 6px 8px"><button style="flex: 1; min-width: 0; min-height: 56px; border: 0; background: transparent; color: #5B5B63; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"/></svg><span>Mi equipo</span></button><button style="flex: 1; min-width: 0; min-height: 56px; border: 0; background: transparent; color: var(--brand); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h13l-2 4 2 4H5"/></svg><span>Hitos</span></button><button style="flex: 1; min-width: 0; min-height: 56px; border: 0; background: transparent; color: #5B5B63; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg><span>Avisos</span></button><button style="flex: 1; min-width: 0; min-height: 56px; border: 0; background: transparent; color: #5B5B63; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg><span>Soporte</span></button></div>
</div>
