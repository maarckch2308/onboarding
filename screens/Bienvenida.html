<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4F5; font-family: 'Barlow', system-ui, sans-serif; color: #2B2B2E; overflow: hidden">

  <!-- Encabezado superior -->
  <div class="app-hdr">
    <div style="font-size: 26px; font-style: italic; font-weight: 700; line-height: 1">Tú eres</div>
    <div style="font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.01em">UNACEM <span style="font-size: 22px; font-style: italic; font-weight: 700; opacity: 0.9">Ecuador</span></div>
  </div>

  <!-- Contenido principal -->
  <div style="flex: 1; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <!-- Mensaje de bienvenida -->
    <div style="flex: none">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 700">¡Bienvenida/o al equipo de <span style="color: var(--brand)">UNACEM Ecuador</span>!</h1>
      <div style="font-size: 14.5px; color: #5B5B63; line-height: 1.4; margin-top: 6px">Esta app te guiará en tu inducción para que conozcas la empresa, a quienes te acompañan y ganes premios en el camino.</div>
    </div>

    <!-- Ilustración del equipo centrada en la mitad -->
    <div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 0">
      <img 
        src="screens/Equipo_Bienvenida.jpg" 
        alt="Equipo UNACEM Ecuador" 
        style="width: 100%; height: 100%; max-height: 280px; object-fit: contain; border-radius: 16px; pointer-events: none"
      />
    </div>

    <!-- Botón Comenzar -->
    <button style="height: 52px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; flex: none">
      Comenzar
    </button>

  </div>

  <!-- Barra de navegación inferior -->
  <div style="height: 72px; flex: none; background: #fff; border-top: 1px solid #E5E5E8; display: flex; align-items: stretch">
    <button style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--brand); font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      Mi ruta
    </button>
    <button style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B5B63; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
      Soporte
    </button>
    <button style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B5B63; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.6 3.5 5.7"/></svg>
      Buddy
    </button>
    <button style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B5B63; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>
      Puntaje
    </button>
  </div>

</div>
