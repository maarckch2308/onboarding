<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">

<div style="--brand: #ff0000; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; font-family: 'Barlow', system-ui, sans-serif; color: #2B2B2E; overflow: hidden">

  <!-- Encabezado con imagen de fondo -->
  <div style="background: url('screens/Geometric Red Architectural Backdrop.png') center/cover no-repeat, var(--brand); padding: 36px 16px 24px; display: flex; flex-direction: column; gap: 4px; color: #fff; position: relative; flex: none;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em">REINDUCCIÓN DE SEGURIDAD</div>
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700">Evaluación de conocimientos</h1>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 4px">
      <span style="white-space: nowrap">Pregunta 1 de 5</span>
      <div style="flex: 1; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.25)"><div style="width: 20%; height: 8px; border-radius: 4px; background: #fff"></div></div>
    </div>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <div style="background: #E6F4EA; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14612B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>
      <div style="font-size: 14px; color: #14612B; font-weight: 600">Asistencia registrada. Ahora completa la evaluación.</div>
    </div>

    <div style="background: #fff; border: 1px solid #E5E5E8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 18px; font-weight: 700; line-height: 1.3">¿Cuál es el uso correcto del EPP en planta?</div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border: 1.5px solid #E5E5E8; border-radius: 12px; box-sizing: border-box">
        <div style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C8C8CE; box-sizing: border-box; flex: none"></div>
        <div style="font-size: 15px; line-height: 1.3">Solo cuando lo indica el supervisor</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border: 2px solid var(--brand); background: #FDEDEF; border-radius: 12px; box-sizing: border-box">
        <div style="width: 22px; height: 22px; border-radius: 11px; border: 6px solid var(--brand); box-sizing: border-box; flex: none; background: #fff"></div>
        <div style="font-size: 15px; line-height: 1.3; font-weight: 600">En todo momento y en todas las áreas de planta</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border: 1.5px solid #E5E5E8; border-radius: 12px; box-sizing: border-box">
        <div style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C8C8CE; box-sizing: border-box; flex: none"></div>
        <div style="font-size: 15px; line-height: 1.3">Solo en trabajos de altura</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border: 1.5px solid #E5E5E8; border-radius: 12px; box-sizing: border-box">
        <div style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C8C8CE; box-sizing: border-box; flex: none"></div>
        <div style="font-size: 15px; line-height: 1.3">Solo para visitantes</div>
      </div>
    </div>

    <div style="flex: 1"></div>

    <button style="height: 52px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 700">Siguiente</button>

  </div>

</div>
