<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4F5; font-family: 'Barlow', system-ui, sans-serif; color: #2B2B2E; overflow: hidden">

  <div style="background: var(--brand); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 6px; color: #fff">
    <button aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700">Nueva consulta</h1>
    <div style="font-size: 14px; opacity: 0.92">Te responderemos dentro de la app</div>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <div>
      <div style="font-size: 14px; font-weight: 700; margin-bottom: 8px">¿Sobre qué es tu consulta?</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <div style="padding: 10px 14px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 700">Accesos y tecnología</div>
        <div style="padding: 10px 14px; border-radius: 999px; border: 1.5px solid #C8C8CE; background: #fff; font-size: 14px; font-weight: 600">Contrato y beneficios</div>
        <div style="padding: 10px 14px; border-radius: 999px; border: 1.5px solid #C8C8CE; background: #fff; font-size: 14px; font-weight: 600">Mi inducción</div>
        <div style="padding: 10px 14px; border-radius: 999px; border: 1.5px solid #C8C8CE; background: #fff; font-size: 14px; font-weight: 600">Trofeos y premios</div>
        <div style="padding: 10px 14px; border-radius: 999px; border: 1.5px solid #C8C8CE; background: #fff; font-size: 14px; font-weight: 600">Otro</div>
      </div>
    </div>

    <div style="background: #EAF2FD; border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <div style="font-size: 14px; color: #1E3A8A; line-height: 1.35">Tu consulta llegará a <b>Soporte Tecnología</b>.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="a" style="font-size: 14px; font-weight: 700">Asunto</label>
      <input id="a" type="text" value="No puedo ingresar a la plataforma e-learning" style="height: 50px; padding: 0 14px; border: 1.5px solid #C8C8CE; border-radius: 12px; font-size: 15px; box-sizing: border-box; width: 100%">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="m" style="font-size: 14px; font-weight: 700">Cuéntanos qué pasa</label>
      <textarea id="m" rows="4" style="padding: 12px 14px; border: 1.5px solid #C8C8CE; border-radius: 12px; font-size: 15px; box-sizing: border-box; width: 100%; resize: none">Mi usuario no es reconocido desde ayer. Me sale el mensaje “credenciales inválidas”.</textarea>
    </div>

    <button style="height: 48px; border: 1.5px dashed #C8C8CE; border-radius: 12px; background: #fff; color: #5B5B63; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.500l-8.500 8.500a5.500 5.500 0 0 1-8-8L13 4.500a3.500 3.500 0 0 1 5 5L9.500 18a1.500 1.500 0 0 1-2-2L15 8.500"/></svg>
      Adjuntar captura (opcional)
    </button>

    <div style="flex: 1"></div>

    <button style="height: 54px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 18px; font-weight: 700">Enviar consulta</button>

  </div>

</div>
