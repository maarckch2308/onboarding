<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; font-family: 'Barlow', system-ui, sans-serif; color: #2B2B2E; overflow: hidden">

  <!-- Ilustración superior de cabecera -->
  <div style="flex: none; width: 100%; height: 390px; padding: 24px 20px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <img 
      src="Logo_Login.jpg" 
      alt="Tú eres UNACEM Ecuador" 
      style="width: 100%; height: 100%; object-fit: contain; pointer-events: none"
    />
  </div>

  <!-- Contenedor del formulario -->
  <div style="flex: 1; padding: 0 24px; display: flex; flex-direction: column; gap: 14px">
    
    <!-- Título y subtítulo centrados -->
    <div style="text-align: center; margin-bottom: 6px">
      <div style="font-size: 19px; font-weight: 700; color: #E2001A; letter-spacing: -0.01em">Gestión Humana</div>
      <div style="font-size: 15px; font-weight: 500; color: #2B2B2E; margin-top: 3px">Desarrollo Organizacional</div>
    </div>

    <!-- Campo Correo -->
    <div style="width: 100%">
      <input 
        id="u" 
        type="text" 
        placeholder="email@domain.com" 
        style="height: 50px; width: 100%; padding: 0 16px; border: 1.5px solid #E5E5EA; border-radius: 12px; font-size: 15px; color: #2B2B2E; box-sizing: border-box; outline: none; background: #fff"
      >
    </div>

    <!-- Campo Contraseña -->
    <div style="width: 100%">
      <input 
        id="p" 
        type="password" 
        placeholder="Contraseña" 
        style="height: 50px; width: 100%; padding: 0 16px; border: 1.5px solid #E5E5EA; border-radius: 12px; font-size: 15px; color: #2B2B2E; box-sizing: border-box; outline: none; background: #fff"
      >
    </div>

    <!-- Botón Ingresar redondeado (Pill) -->
    <button style="margin-top: 4px; height: 50px; border: 0; border-radius: 999px; background: #E2001A; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s">
      Ingresar
    </button>

    <!-- Enlace de recuperación -->
    <div style="text-align: center; margin-top: 4px">
      <a href="#" style="font-size: 13px; color: #8A8A93; text-decoration: none">Olvidé mi contraseña</a>
    </div>

  </div>

</div>
