<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">

<div style="--brand: #ff0000; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; font-family: 'Barlow', system-ui, sans-serif; color: #2B2B2E; overflow: hidden">

  <!-- Encabezado con imagen de fondo -->
  <div style="background: url('screens/Geometric Red Architectural Backdrop.png') center/cover no-repeat, var(--brand); padding: 36px 16px 24px; display: flex; flex-direction: column; gap: 4px; color: #fff; position: relative; flex: none;">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em">UNACEM ECUADOR</div>
      <div style="display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,0.22); font-size: 14px; font-weight: 700">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4.5a3.5 3.5 0 0 0 3.5 4M16 6h3.5a3.5 3.5 0 0 1-3.5 4M12 13v4M8.5 20h7M10 17h4"/></svg>
        <span>150</span>
      </div>
    </div>
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700">Confirma tu desayuno</h1>
    <div style="font-size: 14px; opacity: 0.92">Hito del día 30 · Haz tuyo el rol</div>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <div style="background: #E6F4EA; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14612B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>
      <div style="font-size: 14px; color: #14612B; font-weight: 600">Roberto Landázuri, tu jefe, confirmó el desayuno.</div>
    </div>

    <div style="background: #fff; border: 1px solid #E5E5E8; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 16px; font-weight: 700">¿Se realizó el encuentro?</div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 48px; border: 2px solid var(--brand); border-radius: 12px; background: #FDEDEF; color: var(--brand); font-size: 15px; font-weight: 700">Sí, se realizó</button>
        <button style="flex: 1; height: 48px; border: 1.5px solid #C8C8CE; border-radius: 12px; background: #fff; color: #2B2B2E; font-size: 15px; font-weight: 600">No se realizó</button>
      </div>

      <div style="font-size: 16px; font-weight: 700; margin-top: 4px">¿Cómo fue?</div>
      <div style="display: flex; gap: 8px">
        <button aria-label="1 estrella" style="flex: 1; height: 46px; border: 1.5px solid #F59E0B; border-radius: 10px; background: #FEF3C7; color: #F59E0B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
        <button aria-label="2 estrellas" style="flex: 1; height: 46px; border: 1.5px solid #F59E0B; border-radius: 10px; background: #FEF3C7; color: #F59E0B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
        <button aria-label="3 estrellas" style="flex: 1; height: 46px; border: 1.5px solid #F59E0B; border-radius: 10px; background: #FEF3C7; color: #F59E0B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
        <button aria-label="4 estrellas" style="flex: 1; height: 46px; border: 1.5px solid #F59E0B; border-radius: 10px; background: #FEF3C7; color: #F59E0B; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
        <button aria-label="5 estrellas" style="flex: 1; height: 46px; border: 1.5px solid #C8C8CE; border-radius: 10px; background: #fff; color: #C8C8CE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
      </div>

      <div style="font-size: 16px; font-weight: 700; margin-top: 4px">¿De qué hablaron?</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <div style="padding: 9px 14px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 600">Expectativas del rol</div>
        <div style="padding: 9px 14px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 14px; font-weight: 600">Metas de 90 días</div>
        <div style="padding: 9px 14px; border-radius: 999px; border: 1.5px solid #C8C8CE; font-size: 14px; font-weight: 600">Dudas del equipo</div>
        <div style="padding: 9px 14px; border-radius: 999px; border: 1.5px solid #C8C8CE; font-size: 14px; font-weight: 600">Desarrollo</div>
      </div>
    </div>

    <div style="flex: 1"></div>

    <button style="height: 54px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-size: 18px; font-weight: 700">Confirmar y ganar 150 trofeos</button>

  </div>

</div>
